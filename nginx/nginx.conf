user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # DNS 解析器配置（支持动态 DDNS）
    resolver 8.8.8.8 8.8.4.4 valid=60s;
    resolver_timeout 5s;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # 上游服务
    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # ========== 教学系统前端静态资源 ==========
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ========== 教学系统静态资源 - 从本地提供 ==========
        location /static/ {
            root /usr/share/nginx/html;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ========== 后端静态资源代理 (头像、课程封面等) ==========
        location /static/uploads/ {
            proxy_pass http://backend/static/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 缓存设置
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ========== 后端 API 代理 ==========
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ========== ComfyUI 代理 ==========
        # URL格式: /comfyui/{username}/{port}/{path}
        # 处理所有请求，包括首页、API、静态资源
        location ~ ^/comfyui/([^/]+)/(\d+)(.*)$ {
            set $comfy_port $2;

            # 【核心逻辑】
            # 不要使用 $3 (它已经被 Nginx 自动解码了)。
            # 我们必须从 $request_uri (原始请求) 中手动提取 Raw 路径。
            # 正则逻辑：匹配 /comfyui/任意/数字 之后的所有内容
            if ($request_uri ~* "^/comfyui/[^/]+/[0-9]+(.*)$") {
                set $raw_path $1;
            }

            # 使用提取出的原始编码路径转发（使用 DDNS 域名）
            # 注意：$raw_path 已经包含了查询参数(?xxx)，所以不需要再加 $is_args$args
            proxy_pass http://edu.yanzhiedu.cn:$comfy_port$raw_path;

            # ========== 标准头设置 ==========
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            # 禁用缓冲
            proxy_buffering off;
            proxy_request_buffering off;

            # CORS
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";

            if ($request_method = OPTIONS) {
                return 204;
            }
        }
    }
}
